apply plugin: 'com.android.application'

android {
    namespace 'com.neopixl.pixluisample'
    compileSdk 36

    defaultConfig {
        applicationId project.PACKAGE
        minSdk project.MIN_SDK as Integer
        targetSdk project.TARGET_SDK as Integer
        versionName project.VERSION_NAME
        versionCode Integer.parseInt(project.VERSION_CODE)
    }
}

dependencies {
    implementation project(':pixlui')
}
